[project]
name = "strand-mobile"
version = "0.1.0"
description = "Strand: Flet Android app"
requires-python = ">=3.12"
dependencies = ["flet"]

[dependency-groups]
# flet[all] adds the CLI (flet run / flet build) and the desktop client for testing on the laptop.
# Only "flet" above goes into the APK.
dev = ["flet[all]"]

[tool.flet]
org = "dev.tarnau"
product = "Strand"
company = "TarnauAlexandru"
copyright = "Copyright (C) 2026 TarnauAlexandru"

[tool.flet.app]
path = "src"

[tool.flet.android]
target_arch = ["arm64-v8a"]
