name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, types, tests, security
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Install workspace
        run: uv sync --all-packages

      - name: Ruff (lint)
        run: uv run ruff check .

      - name: Ruff (format)
        run: uv run ruff format --check .

      - name: Mypy
        run: uv run mypy packages/strand_core/src backend/app

      - name: Tests
        run: uv run pytest --cov --cov-report=term-missing

      - name: Bandit (security lint)
        run: uv run bandit -c pyproject.toml -r packages/strand_core/src backend/app

      - name: pip-audit (known vulnerabilities)
        run: uv export --format requirements-txt --no-hashes --no-emit-workspace > /tmp/requirements.txt && uv run pip-audit -r /tmp/requirements.txt
