[project]
name = "strand-ml"
version = "0.1.0"
description = "Strand: model training and ONNX export (not shipped in the app)"
requires-python = ">=3.12"
dependencies = [
    "numpy",
    "scikit-learn",
    "skl2onnx",
    # Same version as the Flet Android build, so desktop parity tests match the phone.
    "onnxruntime==1.27.0",
]

[dependency-groups]
dev = ["pytest"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --import-mode=importlib"
pythonpath = ["."]
