[project]
name = "strand-backend"
version = "0.1.0"
description = "Strand backend API: accounts, catalog, reviews and saved looks (no ML, no photos)"
requires-python = ">=3.12"
dependencies = [
    "strand-core",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.uv.sources]
strand-core = { workspace = true }
